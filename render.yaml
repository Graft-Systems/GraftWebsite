services:
  - type: web
    name: graft-api
    runtime: python
    rootDir: services/api
    plan: pro
    autoDeploy: true
    healthCheckPath: /
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "import torch; torch.hub.load('facebookresearch/dinov2', 'dinov2_vits14', verbose=False, trust_repo=True, skip_validation=True)"
    startCommand: >-
      bash -lc "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn graft_api.wsgi --bind 0.0.0.0:$PORT --log-file - --capture-output --error-logfile -
      --workers 1 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://graftsystems.com,https://www.graftsystems.com,https://graft-website-two.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://graftsystems.com,https://www.graftsystems.com,https://graft-website-two.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: https://.*\\.vercel\\.app
      - key: CONTACT_TO_EMAIL
        value: graftsystems@gmail.com
      - key: CONTACT_FROM_EMAIL
        value: Graft Systems Site <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: graft-db
          property: connectionString
      # ── v2 inference (DINOv2 + HistGradientBoosting) ──
      - key: PREDICTION_BACKBONE
        value: dinov2_vits14
      - key: PREDICTION_MODEL_PATH
        value: models/v4/model.joblib
      - key: PREDICTION_TOOL_ROOT
        value: PredictionTool
      - key: PREDICTION_USE_RAW_DEPTH
        value: "false"
      # User uploads (/tool history, newsroom). Prefer S3 for durable public URLs.
      - key: USE_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false

databases:
  - name: graft-db
    plan: free
