services:
  - type: web
    name: graft-api
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      bash -lc "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn graft_api.wsgi --bind 0.0.0.0:$PORT --log-file - --capture-output --error-logfile -"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-vercel-domain.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: https://.*\\.vercel\\.app
      - key: CONTACT_TO_EMAIL
        value: graftsystems@gmail.com
      - key: CONTACT_FROM_EMAIL
        value: Graft Systems Site <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: graft-db
          property: connectionString

databases:
  - name: graft-db
    plan: free
