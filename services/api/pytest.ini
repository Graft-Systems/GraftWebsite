[pytest]
DJANGO_SETTINGS_MODULE = graft_api.settings
python_files = test_*.py
testpaths = spray/tests
addopts = -ra -q
# M0-04: services/worker imports `spray.models`, and services/api's
# tests in turn import `graft_worker.lake_writer`. Add the worker
# package to sys.path so both work.
pythonpath = . ../worker
