name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "graft-spray/main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies (services/api)
        working-directory: services/api
        run: pip install -r requirements.txt

      - name: Lint workspace
        run: pnpm turbo run lint --continue
        continue-on-error: true

      - name: Type-check workspace
        run: pnpm turbo run type-check --continue
        continue-on-error: true

      - name: Build workspace
        run: pnpm turbo run build

      - name: Test workspace
        run: pnpm turbo run test --continue
        continue-on-error: true

      - name: Django check (services/api)
        working-directory: services/api
        run: python manage.py check

# Notes for future expansion (M0-02 onwards):
# - Drop continue-on-error from lint/type-check/test once real rule sets land
#   in @graft/eslint-config and Vitest/pytest suites are populated.
# - Add coverage upload (Codecov) when test suites cover meaningful surface area.
# - Add Playwright E2E job (separate, on a Vercel preview URL or local server)
#   when the Spray app shell is testable end-to-end (M0-02a).
# - Add schema-registry-check job (M0-04+) per spec section 19.4.
